name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  stylua:
    name: Format check (Stylua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: JohnnyMorganz/stylua-action@a456f65efd59b2c28beb2c3a862711f78291551c
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check lua spec

  luacheck:
    name: Lint (Luacheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10

      - uses: leafo/gh-actions-luarocks@v4

      - run: luarocks install luacheck

      - run: luacheck lua spec

  test:
    name: Test (Lua ${{ matrix.lua-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua-version: ["5.1", "5.4"]
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: ${{ matrix.lua-version }}

      - uses: leafo/gh-actions-luarocks@v4

      - run: luarocks --lua-version=${{ matrix.lua-version }} install busted

      - run: busted spec
